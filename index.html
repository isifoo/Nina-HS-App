<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fde8f0">
<title>Nina's High School Plan</title>
<style>
:root{
  --bg:#fff7fb; --ink:#4a3f55; --muted:#8d8299; --card:#ffffff;
  --pink:#fbd5e5; --lav:#e3d9fb; --mint:#d2f3e6; --peach:#ffe3cf; --sky:#d6ebfb; --lemon:#fff4c7; --rose:#f9c9cf;
  --shadow:0 6px 20px rgba(150,120,170,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:linear-gradient(180deg,#fde8f0 0,#f0e9fd 260px,var(--bg) 520px) fixed;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;line-height:1.45;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
header{text-align:center;padding:18px 0 8px}
h1{margin:0;font-size:1.9rem;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0}
.stats{display:flex;gap:10px;margin:18px 0}
.stat{flex:1;background:var(--card);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.5rem}
.stat span{font-size:.78rem;color:var(--muted)}
.stat:nth-child(1){background:var(--lav)}.stat:nth-child(2){background:var(--mint)}.stat:nth-child(3){background:var(--peach)}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{border:0;border-radius:999px;padding:8px 14px;background:var(--card);color:var(--ink);font:inherit;font-size:.88rem;white-space:nowrap;box-shadow:0 2px 8px rgba(150,120,170,.12);cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.card{background:var(--card);border-radius:24px;padding:18px;margin:14px 0;box-shadow:var(--shadow);border-top:8px solid var(--pink)}
.card:nth-child(4n+2){border-top-color:var(--lav)}.card:nth-child(4n+3){border-top-color:var(--mint)}.card:nth-child(4n+4){border-top-color:var(--peach)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card h2{margin:0;font-size:1.2rem}
.loc{color:var(--muted);font-size:.9rem;margin-top:2px}
.rank{background:var(--lemon);border-radius:14px;padding:4px 10px;font-weight:700;font-size:.9rem;white-space:nowrap}
.badge{display:inline-block;margin:10px 0 4px;padding:4px 12px;border-radius:999px;font-size:.82rem;font-weight:700}
.s-Researching{background:var(--sky)}.s-Visit-planned{background:var(--lemon)}.s-Visited{background:var(--mint)}
.s-Applying{background:var(--peach)}.s-Submitted{background:var(--lav)}.s-Accepted{background:#bff0d0}
.s-Waitlisted{background:var(--peach)}.s-Declined{background:var(--rose)}
.type{font-size:.9rem;color:var(--muted);margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cell{background:#faf7fd;border-radius:14px;padding:8px 10px}
.cell:last-child{grid-column:span 2}
.cell small{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
.bar{height:10px;background:#f1eaf7;border-radius:99px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f8b4d0,#c7b3f5);border-radius:99px}
details{margin-top:8px}
summary{cursor:pointer;color:var(--muted);font-size:.88rem;padding:6px 0}
ul.cl{list-style:none;padding:0;margin:6px 0}
ul.cl li{padding:4px 0}
.note{font-size:.9rem;background:var(--lemon);border-radius:14px;padding:8px 12px;margin-top:8px}
h3{margin:28px 0 8px}
.dates{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:6px 16px}
.dates div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #eadff5}
.dates div:last-child{border:0}
.edit{display:block;text-align:center;margin:30px auto 0;padding:14px 20px;border-radius:18px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;max-width:340px;box-shadow:var(--shadow)}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎨 Nina's High School Plan</h1>
    <p class="sub">Schools, dates and to-dos in one place</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="n-total">0</b><span>Schools</span></div>
    <div class="stat"><b id="n-sub">0</b><span>Submitted</span></div>
    <div class="stat"><b id="n-next">–</b><span>Next deadline</span></div>
  </div>

  <div class="filters" id="filters"></div>
  <div id="list"></div>

  <h3>📅 Key dates</h3>
  <div class="dates" id="dates"></div>

  <a class="edit" id="edit" href="#">✏️ Edit schools</a>
  <p class="hint">Tap, change the text, then “Commit changes”. The site updates in about a minute.</p>
</div>

<script>
const REPO = "isifoo/Nina-HS-App";
document.getElementById("edit").href = `https://github.com/${REPO}/edit/main/schools.json`;
const cls = s => "s-" + s.replace(/\s+/g, "-");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let data, filter = "All";

fetch("schools.json?" + Date.now()).then(r => r.json()).then(d => { data = d; render(); })
  .catch(() => document.getElementById("list").textContent = "Could not load schools.json");

function render() {
  const S = data.schools;
  document.getElementById("n-total").textContent = S.length;
  document.getElementById("n-sub").textContent = S.filter(s => ["Submitted","Accepted","Waitlisted"].includes(s.status)).length;
  const dl = S.map(s => ({s, t: Date.parse(s.deadline)})).filter(x => !isNaN(x.t) && x.t >= Date.now() - 864e5).sort((a,b) => a.t - b.t)[0];
  document.getElementById("n-next").textContent = dl ? new Date(dl.t).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "–";

  const statuses = ["All", ...new Set(S.map(s => s.status))];
  document.getElementById("filters").innerHTML = statuses.map(s => `<button class="chip ${s===filter?"on":""}" data-f="${esc(s)}">${esc(s)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; render(); });

  const items = S.filter(s => filter === "All" || s.status === filter)
    .sort((a,b) => (a.rank ?? 99) - (b.rank ?? 99));
  document.getElementById("list").innerHTML = items.map(s => {
    const done = s.done || [], total = data.checklist.length, pct = Math.round(done.length / total * 100);
    return `<article class="card">
      <div class="top"><div><h2>${esc(s.name)}</h2><div class="loc">📍 ${esc(s.location)}</div></div>
        ${s.rank ? `<div class="rank">#${esc(s.rank)}</div>` : ""}</div>
      <span class="badge ${cls(s.status)}">${esc(s.status)}</span>
      <div class="type">${esc(s.type)}</div>
      <div class="grid">
        <div class="cell"><small>Deadline</small>${esc(s.deadline)}</div>
        <div class="cell"><small>Test / audition</small>${esc(s.test)}</div>
        <div class="cell"><small>Interview</small>${esc(s.interview)}</div>
      </div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <small style="color:var(--muted)">${done.length} of ${total} steps done</small>
      <details><summary>Checklist</summary><ul class="cl">
        ${data.checklist.map(c => `<li>${done.includes(c) ? "✅" : "⬜"} ${esc(c)}</li>`).join("")}</ul></details>
      ${s.pros ? `<details><summary>Pros / cons</summary><p>👍 ${esc(s.pros)}</p><p>👎 ${esc(s.cons)}</p></details>` : ""}
      ${s.notes ? `<div class="note">📝 ${esc(s.notes)}</div>` : ""}
    </article>`;
  }).join("") || "<p class='sub' style='text-align:center'>No schools here yet.</p>";

  document.getElementById("dates").innerHTML = data.keyDates.map(k => `<div><span>${esc(k.what)}</span><b>${esc(k.date)}</b></div>`).join("");
}
</script>
</body>
</html>
